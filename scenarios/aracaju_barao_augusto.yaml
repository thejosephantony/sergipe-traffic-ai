scenario:
  id: "aracaju_barao_augusto_v1"
  description: "Simulação inspirada no cruzamento de grande fluxo em Aracaju/SE envolvendo a Av. Barão de Maruim / Des. Maynard com a Av. Augusto Franco."
  location:
    city: "Aracaju"
    state: "SE"
    primary_axis: "Av. Barão de Maruim / Av. Des. Maynard"
    intersecting_axis: "Av. Augusto Franco (Rio de Janeiro)"
  seed: 42
  duration_s: 1800
  time_step_s: 0.2
  demand:
    axis_barao_maynard_rate: 0.85
    axis_augusto_franco_rate: 0.75
    vehicle_mix:
      car: 0.72
      motorcycle: 0.18
      bus: 0.10
    vehicle_mix_note: "Distribuição sintética para prototipagem; não representa contagem veicular real do cruzamento."
    direction_split:
      barao_eastbound: 0.50
      barao_westbound: 0.50
      augusto_northbound: 0.50
      augusto_southbound: 0.50
    direction_split_note: "Divisão sintética equilibrada entre sentidos para prototipagem."
  controller:
    type: fixed
    min_green_s: 15
    max_green_s: 60
    yellow_s: 3
    all_red_s: 1
    cycle_duration_s: 78
