[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sergipe-traffic-ai"
version = "0.1.0"
description = "Simulador inteligente de trânsito e controle adaptativo de semáforos"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sergipe Traffic AI Team"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sergipe-traffic-ai = "sergipe_traffic_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
